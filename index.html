<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>All-knowing Space Tortoise</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body background="https://i.pinimg.com/originals/0e/0d/72/0e0d72395ecbc6682ea8e7276bc6fe06.gif">
    <header class="hero">
      <h1>All-knowing Space Tortoise</h1>
      <p class="tagline">press for a random space fact</p>
    </header>
    <main>
      <section class="fact-card">
         <div class="tortoise" id="tortoise">
          <img class="scene" src="Screenshot 2026-09-07 at 19.32.21.png" alt="a space turtle" />
        </div>
        <button id="press">press the all-knowing space tortoise</button>
        <p class="message" id="message">press the button for the all-knowing space tortoise to tell you a random space fact</p>
      </section>
    </main>
    <footer>
      <p>made by Purli, floating in space</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
